<div class="container">
  <mat-toolbar class="custom-toolbar">
    <button 
    matButton 
    class="btn-rojo" 
    aria-label="Example icon-button with menu icon"
    [matMenuTriggerFor]="menuDevice">
      <mat-icon>menu</mat-icon>Tipo Vehiculo
    </button>
  </mat-toolbar>
  <mat-menu #menuDevice="matMenu">
  <button mat-menu-item routerLink="/tipovehiculos">Listar</button>
  <button mat-menu-item routerLink="/tipovehiculos/nuevo">Registrar</button>
  <button mat-menu-item routerLink="/menu">Menu</button>
  </mat-menu>
</div>
<div [hidden]="route.children.length!=0">
    <app-tipo-vehiculo-listar></app-tipo-vehiculo-listar>
</div>
<router-outlet></router-outlet>
