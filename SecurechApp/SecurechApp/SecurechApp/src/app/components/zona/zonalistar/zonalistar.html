<div class="container">

  <div style="text-align: center; margin: 5%">
    <h2>Lista de Zonas</h2>
  </div>

  <div style="
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 10px;
  ">

    @for (zona of zonas; track zona.idZona) {

      <mat-card class="zona-card mat-elevation-z4">

        <mat-card-header>
          <mat-card-title>{{ zona.nombre }}</mat-card-title>
          <mat-card-subtitle>{{ zona.distrito }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>

          <p><strong>ID:</strong> {{ zona.idZona }}</p>
          <p><strong>Estado:</strong> {{ zona.estadoZona }}</p>
          <p><strong>Latitud:</strong> {{ zona.latitud }}</p>
          <p><strong>Longitud:</strong> {{ zona.longitud }}</p>

        </mat-card-content>

        <mat-card-actions style="display: flex; justify-content: space-between;">
          
          <!-- Editar -->
          <button mat-icon-button color="primary"
                  [routerLink]="['edits', zona.idZona]">
            <mat-icon>edit</mat-icon>
          </button>

          <!-- Eliminar -->
          <button mat-icon-button color="warn"
                  (click)="eliminar(zona.idZona)">
            <mat-icon>delete</mat-icon>
          </button>

        </mat-card-actions>

      </mat-card>

    }

  </div>
</div>
