<div class="page">

  <div class="content">
    <div style="text-align: center; margin: 2%">
      <h2>Lista de Vehículos</h2>
    </div>

    <div class="card-grid">

      @for (element of dataSource.data; track element.id_tipovehiculo) {

      <mat-card class="vehiculo-card mat-elevation-z4">

        <mat-card-header>
          <mat-card-title>{{ element.nombre_vehiculo }}</mat-card-title>
          <mat-card-subtitle>ID: {{ element.id_tipovehiculo }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p><strong>Nombre:</strong> {{ element.nombre_vehiculo }}</p>
          <p><strong>ID:</strong> {{ element.id_tipovehiculo }}</p>
        </mat-card-content>

        <mat-card-actions style="display: flex; justify-content: space-between;">
          @if (rolUsuario === 'ADMIN'){
          <!-- Editar -->
          <button mat-icon-button [routerLink]="['edits', element.id_tipovehiculo]">
            <mat-icon>edit</mat-icon>
          </button>
          }

          @if (rolUsuario === 'ADMIN'){
          <!-- Eliminar -->
          <button mat-icon-button (click)="eliminar(element.id_tipovehiculo)">
            <mat-icon>delete</mat-icon>
          </button>
          }
        </mat-card-actions>

      </mat-card>

      }

    </div>

  </div>

</div>
