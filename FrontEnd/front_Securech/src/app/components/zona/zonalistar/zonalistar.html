<div class="container">
    <div style="text-align: center; margin: 5%">
    <h2>Lista de Zonas</h2>
    </div>
    
    <div style="text-align: center; margin: 5%">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->
            <!-- Position Column -->
            <ng-container matColumnDef="c1">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.idZona}} </td>
            </ng-container>
            <!-- Name Column -->
            <ng-container matColumnDef="c2">
                <th mat-header-cell *matHeaderCellDef> Nombre </th>
                <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
            </ng-container>
            <!-- Name Column -->
            <ng-container matColumnDef="c3">
                <th mat-header-cell *matHeaderCellDef> Distrito </th>
                <td mat-cell *matCellDef="let element"> {{element.distrito}} </td>
            </ng-container>
            <!-- Name Column -->
            <ng-container matColumnDef="c4">
                <th mat-header-cell *matHeaderCellDef> Estado </th>
                <td mat-cell *matCellDef="let element"> {{element.estadoZona}} </td>
            </ng-container>
            <!-- Name Column -->
            <ng-container matColumnDef="c5">
                <th mat-header-cell *matHeaderCellDef> Latitud </th>
                <td mat-cell *matCellDef="let element"> {{element.latitud}} </td>
            </ng-container>
            <!-- Name Column -->
            <ng-container matColumnDef="c6">
                <th mat-header-cell *matHeaderCellDef> Longitud </th>
                <td mat-cell *matCellDef="let element"> {{element.longitud}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
