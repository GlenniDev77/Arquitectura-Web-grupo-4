<div class="container">
  <div style="text-align: center; margin: 5%"><h2>Resgistro de Vehiculos</h2></div>

  <div style="text-align: center; margin: 5%">
    <form [formGroup]="form" (submit)="aceptar()">
      @if(edicion){
      <mat-form-field>
        <mat-label>ID</mat-label>
        <input matInput readonly formControlName="codigo" />
      </mat-form-field>
      }
      <br />
      <mat-form-field>
        <mat-label>Tipo de dispositivo</mat-label>
        <mat-select formControlName="tipo">
          @for (t of typeDevices; track t) {
          <mat-option [value]="t.value">{{ t.viewValue }}</mat-option>
          }
        </mat-select>
        <mat-error> @if (form.get('tipo')?.hasError('required')) { Ingrese tipo!! } </mat-error>
      </mat-form-field>

      <div>
        <button matButton="elevated">Guardar</button>
      </div>
    </form>
  </div>
</div>
